<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Note Wall">
  <defs>
    <linearGradient id="nw-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdeeb8"/>
      <stop offset="0.55" stop-color="#fbe8a6"/>
      <stop offset="1" stop-color="#f6dcb8"/>
    </linearGradient>
    <linearGradient id="nw-paper" x1="18" y1="12" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdfaf1"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#nw-bg)"/>

  <!-- the note: a sheet with a torn top-right corner -->
  <path d="M20 12h18.6L46 19.4V50a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z"
        fill="url(#nw-paper)"/>
  <path d="M38.6 12v6.4a1 1 0 0 0 1 1H46z" fill="#f3e2b0"/>

  <!-- ink: two written lines -->
  <g stroke="#615129" stroke-width="2.6" stroke-linecap="round" opacity="0.82">
    <path d="M23 27h18"/>
    <path d="M23 34h13.5"/>
  </g>

  <!-- a third, still-unwritten line -->
  <path d="M23 41h8" stroke="#615129" stroke-width="2.6" stroke-linecap="round" opacity="0.32"/>

  <!-- pin dot: the "stick it on the wall" accent -->
  <circle cx="45.5" cy="44.5" r="4.2" fill="#e8a0b8"/>
</svg>
